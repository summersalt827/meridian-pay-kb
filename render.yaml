services:
  - type: web
    name: meridian-pay-kb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_ui.py
    envVars:
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
      - key: KB_MIN_SCORE
        value: "0.3"
