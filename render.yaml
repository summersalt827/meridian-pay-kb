services:
  - type: web
    name: meridian-pay-kb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_ui.py
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
      - key: KB_MIN_SCORE
        value: "0.17"
      - key: KB_AUTH_SECRET
        sync: false
      - key: KB_RESYNC_MINUTES
        value: "60"
      - key: KB_LOGIN_RATE_LIMIT
        value: "120"
